[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "c2g-system"
version = "1.18.0"
description = "Reproducible research and forward-paper infrastructure for the C2G quantitative system"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "From Code to Gold" }]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
market-data = [
  "ccxt>=4.4,<5",
  "requests>=2.31,<3",
]
dev = [
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["archive", "venv", "data_loader_*.py"]
