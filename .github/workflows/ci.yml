name: C2G validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install C2G
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run unit and historical regression tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild canonical backtests
        run: python scripts/run_backtests.py --bootstrap-samples 1000 --output-dir reports/ci

      - name: Upload backtest report
        uses: actions/upload-artifact@v7
        with:
          name: c2g-backtest-report
          path: reports/ci
          retention-days: 14
