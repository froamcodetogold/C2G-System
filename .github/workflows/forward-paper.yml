name: C2G forward paper logger

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c2g-forward-paper
  cancel-in-progress: false

jobs:
  update-forward-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install C2G
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Refresh Bybit data in the runner
        run: python scripts/update_bybit_data.py --forward-only

      - name: Update the append-only V1.17 ledger
        run: python scripts/run_forward.py --profile v117

      - name: Package the forward snapshot
        uses: actions/upload-artifact@v7
        with:
          name: c2g-v117-forward-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            c2g_v117_forward_ledger.csv
            c2g_v117_forward_summary.csv
            c2g_v117_forward_manifest.json
